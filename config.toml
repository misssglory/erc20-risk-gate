# Accepts: ethereum/eth/1, base/8453, bsc/bnb/56, robinhood/hood/rh/4663
chain_id = "ethereum"

[logging]
level = "info"

[server]
host = "127.0.0.1"
port = 8333

[http]
timeout_seconds = 20

[api]
tokensniffer_api_key = ""
etherscan_api_key = "42SF3SUB2FZN5I5GFDTQGN37QEMP5EG67U"
goplus_token = ""

# Native Robinhood Chain risk gate. Uses Etherscan V2 for explorer data and the official RPC for direct eth_call/getCode simulation.
[robinhood]
enabled = true
rpc_url = "https://rpc.mainnet.chain.robinhood.com"

# Inspect this many top holders, skipping deployer/owner/contracts, until a real EOA is found.
holders_limit = 50

# Simulate transferring 1/N of the selected holder's current on-chain balance.
transfer_amount_divisor = 100

# Robinhood Chain Uniswap v4 PoolManager. May be changed to another sell-path target.
transfer_target = "0x8366a39cc670b4001a1121b8f6a443a643e40951"

# Shape used by the observed 9-decimal blocked-sell family.
template_min_bytecode_bytes = 8192
template_max_bytecode_bytes = 10240

# Confirmed direct honeypot evidence persists deployer/owner here.
bad_actor_db_path = "robinhood-bad-actors.json"
hard_block_known_bad_actor = true
bad_deployers = []
bad_owners = []

[rules]
min_score_buy = 85
tokensniffer_min_score = 60

sell_tax_warn = 1.0
sell_tax_block = 5.0

buy_tax_warn = 1.0
buy_tax_block = 5.0

skip_unverified_source = true
